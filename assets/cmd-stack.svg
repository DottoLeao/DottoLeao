<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" role="img" aria-label="cat stack.json">
  <defs>
  <style>
    .col{animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
    @keyframes fall{from{transform:translateY(-110%)}to{transform:translateY(110%)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.col,.blink,.track{animation:none}}
  </style>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x=".5" y=".5" width="1199" height="55" rx="12" fill="#010a05" stroke="#00ff88" stroke-opacity=".3"/>
  <text x="22" y="36" font-size="22" fill="#d6ffe9"><tspan fill="#00ff88" font-weight="700">~ $</tspan> cat stack.json <tspan class="blink" fill="#00ff88">▍</tspan></text>
</svg>